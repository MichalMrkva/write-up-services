services:
  traefik:
    image: traefik:v3.6.1
    container_name: traefik-test
    environment:
      - DOCKER_API_VERSION=1.52
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=mrkva.michal@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - web_test

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`test-be.write-up.eu`)"
      - "traefik.http.routers.api-gateway.entrypoints=websecure"
      - "traefik.http.routers.api-gateway.tls.certresolver=myresolver"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=3000"
    depends_on:
      - user-service
      - books-service
      - profile-service
    ports:
      - 3000:3000
    networks:
      - web_test

  books-service:
    build: ./books-service
    container_name: books-service
    #ports: 3001:3001
    networks:
      - web_test

  profile-service:
    build: ./profile-service
    container_name: profile-service
    #ports: 3002:3002
    networks:
      - web_test

  user-service:
    build: ./user-service
    container_name: user-service
    networks:
      - web_test
    #ports: 3003:3003

networks:
  web_test:
    external: true
